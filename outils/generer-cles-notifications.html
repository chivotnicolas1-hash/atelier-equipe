<!doctype html><html lang="fr"><meta charset="utf-8"><title>Clés notifications — Atelier Fayet 33</title><style>body{font:17px system-ui;max-width:850px;margin:40px auto;padding:20px}textarea{width:100%;height:85px}button{padding:12px;font:inherit}label{display:block;margin-top:20px}</style><h1>Configurer les notifications</h1><p>Ce fichier fonctionne localement, sans envoyer les clés sur Internet. Génère les clés une seule fois et conserve-les dans un endroit sûr. Ne publie pas la clé privée ni le secret sur GitHub.</p><button id="generate">Générer mes clés</button><div id="result"></div><script>
const b64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
document.getElementById('generate').onclick=async()=>{try{const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const pub=b64(await crypto.subtle.exportKey('raw',pair.publicKey));const privateKey=(await crypto.subtle.exportKey('jwk',pair.privateKey)).d;const secret=b64(crypto.getRandomValues(new Uint8Array(32)));const result=document.getElementById('result');result.replaceChildren();for(const [name,value] of [['VAPID_PUBLIC_KEY (également VITE_VAPID_PUBLIC_KEY dans Cloudflare)',pub],['VAPID_PRIVATE_KEY (Supabase uniquement)',privateKey],['PUSH_CRON_SECRET (Supabase et Vault uniquement)',secret]]){const label=document.createElement('label');label.textContent=name;const field=document.createElement('textarea');field.value=value;field.readOnly=true;label.append(field);result.append(label)}document.getElementById('generate').disabled=true}catch(e){document.getElementById('result').textContent='Ouvre ce fichier dans Chrome ou Edge à jour : '+e.message}};
</script></html>
